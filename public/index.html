<!doctype html>
<html lang="en">

<head>

<meta charset="utf-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1"
>

<title>Bianco Precast - Greenair TrendLog</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>

<style>

* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  min-height: 100%;
}

body {
  font-family: Arial, Helvetica, sans-serif;
  background: #f3f3f3;
  color: #222;
}


/* ==================================================
HEADER
================================================== */

.top-header {
  display: flex;
  align-items: center;
  justify-content: space-between;

  padding: 8px 14px;

  background: white;

  border-bottom: 1px solid #d6d6d6;
}

.brand-left {
  display: flex;
  flex-direction: column;
}

.bianco-title {
  color: #f57c00;
  font-size: 20px;
  font-weight: 900;
  letter-spacing: 1px;
}

.greenair-title {
  color: #1b5e20;
  font-size: 16px;
  font-weight: 800;
}

.header-centre {
  display: flex;
  align-items: center;
  gap: 8px;
}

.mode-badge {
  padding: 4px 9px;
  border-radius: 12px;

  font-size: 10px;
  font-weight: 900;
}

.mode-badge.live {
  background: #e8f5e9;
  color: #1b5e20;
}

.mode-badge.history {
  background: #e3f2fd;
  color: #0d47a1;
}

.connection-box {
  display: flex;
  align-items: center;
  gap: 8px;
}

.connection-label {
  font-size: 12px;
  color: #666;
}

.led {
  width: 14px;
  height: 14px;
  border-radius: 50%;
}

.led.good {
  background: #00c853;
  box-shadow: 0 0 7px rgba(0,200,83,.8);
}

.led.bad {
  background: #d50000;
  box-shadow: 0 0 7px rgba(213,0,0,.8);
}

.led.waiting {
  background: #ffb300;
  box-shadow: 0 0 7px rgba(255,179,0,.8);
}


/* ==================================================
TOOLBAR
================================================== */

.toolbar {
  display: flex;
  flex-wrap: wrap;
  align-items: center;

  gap: 6px;

  padding: 8px 10px;

  background: #f7f7f7;

  border-bottom: 1px solid #d6d6d6;
}

.toolbar label {
  font-size: 12px;
  font-weight: 700;
}

.toolbar select,
.toolbar button {

  height: 32px;

  border: 1px solid #c7c7c7;
  border-radius: 4px;

  background: white;

  padding: 0 10px;

  font-size: 12px;
}

.toolbar button {
  cursor: pointer;
}

.toolbar button:hover {
  background: #eee;
}

.live-button {
  color: #2e7d32;
}

.png-button {
  background: #6a1b9a !important;
  color: white;
  border-color: #6a1b9a !important;
}

.export-button {
  margin-left: auto;

  background: #263238 !important;

  color: white;
}


/* ==================================================
CUSTOM HISTORY
================================================== */

.custom-history {
  display: none;
  flex-wrap: wrap;
  align-items: center;

  gap: 8px;

  padding: 9px 10px;

  background: #fff8e1;

  border-bottom: 1px solid #e4d6a4;
}

.custom-history.show {
  display: flex;
}

.custom-history label {
  font-size: 12px;
  font-weight: 700;
}

.custom-history input {
  height: 32px;

  border: 1px solid #c7c7c7;
  border-radius: 4px;

  padding: 0 8px;
}

.custom-history button {

  height: 32px;

  border: 0;
  border-radius: 4px;

  padding: 0 14px;

  cursor: pointer;

  font-weight: 800;
}

.load-history-button {
  background: #1565c0;
  color: white;
}

.history-status {
  font-size: 12px;
  color: #666;
}


/* ==================================================
RANGE BAR
================================================== */

.range-bar {

  display: flex;

  justify-content: space-between;

  padding: 5px 12px;

  background: white;

  border-bottom: 1px solid #ddd;

  font-size: 11px;

  color: #666;
}

.range-bar strong {
  color: #333;
}


/* ==================================================
MAIN LAYOUT
================================================== */

.main-layout {

  display: grid;

  grid-template-columns:
    290px 1fr;

  gap: 8px;

  padding: 8px;

  height: calc(100vh - 137px);

  min-height: 620px;
}


/* ==================================================
SIDEBAR
================================================== */

.sidebar {

  background: white;

  border: 1px solid #d8d8d8;

  border-radius: 4px;

  padding: 8px;

  overflow: auto;
}

.side-controls {

  display: grid;

  grid-template-columns:
    1fr 1fr;

  gap: 6px;

  margin-bottom: 8px;
}

.side-controls button {

  height: 31px;

  border: 1px solid #ccc;

  border-radius: 4px;

  background: white;

  cursor: pointer;

  font-weight: 700;
}

.point-row {

  display: grid;

  grid-template-columns:
    28px 1fr auto;

  align-items: center;

  gap: 7px;

  padding: 10px 8px;

  margin-bottom: 6px;

  border: 1px solid #e1e1e1;

  border-radius: 4px;

  background: #fafafa;

  cursor: pointer;
}

.point-row.disabled {
  opacity: .4;
}

.point-number {
  font-size: 11px;
  color: #888;
}

.point-name {
  font-size: 13px;
  font-weight: 700;
}

.point-state {

  font-size: 9px;

  font-weight: 900;

  color: #2e7d32;
}

.point-row.disabled .point-state {
  color: #c62828;
}

.point-value {

  grid-column: 2 / 4;

  font-size: 18px;

  font-weight: 900;

  color: #1b5e20;
}

.color-bar {

  grid-column: 1;

  width: 18px;

  height: 8px;

  border-radius: 5px;
}


/* ==================================================
GRAPH
================================================== */

.graph-panel {

  position: relative;

  background: white;

  border: 1px solid #d8d8d8;

  border-radius: 4px;

  padding: 10px;

  min-width: 0;
}

.graph-container {

  position: relative;

  width: 100%;

  height: 100%;
}

.graph-info {

  position: absolute;

  right: 18px;

  bottom: 12px;

  padding: 4px 7px;

  background:
    rgba(255,255,255,.9);

  font-size: 11px;

  color: #666;
}


/* ==================================================
MOBILE
================================================== */

@media (max-width: 850px) {

  .main-layout {

    grid-template-columns:
      1fr;

    height: auto;

    min-height: 0;
  }

  .graph-panel {
    height: 520px;
  }

  .export-button {
    margin-left: 0;
  }
}

</style>

</head>


<body>


<div class="top-header">

  <div class="brand-left">

    <div class="bianco-title">
      BIANCO PRECAST
    </div>

    <div class="greenair-title">
      GREENAIR TRENDLOG
    </div>

  </div>


  <div class="header-centre">

    <strong>
      Trend Log
    </strong>

    <div
      id="modeBadge"
      class="mode-badge live"
    >
      LIVE
    </div>

  </div>


  <div class="connection-box">

    <span class="connection-label">
      BMS
    </span>

    <div
      id="connectionLed"
      class="led waiting"
    ></div>

  </div>

</div>


<div class="toolbar">

<label>
Time Base:
</label>


<select id="timeBase">

<option value="5">
5 minutes
</option>

<option value="15">
15 minutes
</option>

<option value="30">
30 minutes
</option>

<option value="60">
1 hour
</option>

<option value="360">
6 hours
</option>

<option value="720">
12 hours
</option>

<option value="1440">
24 hours
</option>

<option value="custom">
Custom Define
</option>

</select>


<button id="zoomInButton">
Zoom In
</button>

<button id="zoomOutButton">
Zoom Out
</button>

<button id="resetButton">
Reset
</button>

<button
  id="liveButton"
  class="live-button"
>
Live
</button>

<button id="last5Button">
Last 5 min
</button>

<button
  id="printPngButton"
  class="png-button"
>
Print Full A3
</button>

<button
  id="exportButton"
  class="export-button"
>
Export
</button>

</div>


<div
  id="customHistory"
  class="custom-history"
>

<label>
From:
</label>

<input
  id="fromDate"
  type="datetime-local"
>

<label>
To:
</label>

<input
  id="toDate"
  type="datetime-local"
>

<button
  id="loadHistoryButton"
  class="load-history-button"
>
Load History
</button>

<span
  id="historyStatus"
  class="history-status"
>
Select a date range
</span>

</div>


<div class="range-bar">

<span>
Mode:
<strong id="rangeMode">
Live
</strong>
</span>


<span>
Display Range:
<strong id="displayRange">
Waiting...
</strong>
</span>

</div>


<div class="main-layout">

<aside class="sidebar">

<div class="side-controls">

<button id="showAllButton">
Show All
</button>

<button id="hideAllButton">
Hide All
</button>

</div>

<div id="pointList"></div>

</aside>


<section class="graph-panel">

<div class="graph-container">

<canvas id="trendChart"></canvas>

</div>

<div
  id="graphInfo"
  class="graph-info"
>
Loading...
</div>

</section>

</div>


<script>


/* ==================================================
POINTS
================================================== */

const POINTS = [

{
  id: "in1",
  number: 1,
  name: "Planks In",
  colour: "red"
},

{
  id: "in2",
  number: 2,
  name: "Planks Out",
  colour: "blue"
},

{
  id: "in3",
  number: 3,
  name: "Ambient",
  colour: "green"
},

{
  id: "in4",
  number: 4,
  name: "Planks Concrete",
  colour: "orange"
},

{
  id: "in5",
  number: 5,
  name: "Planks Tank",
  colour: "purple"
},

{
  id: "diff",
  number: 6,
  name:
    "Ambient - Concrete Differential",
  colour: "black"
}

];


/* ==================================================
ELEMENTS
================================================== */

const led =
document.getElementById(
"connectionLed"
);

const modeBadge =
document.getElementById(
"modeBadge"
);

const rangeMode =
document.getElementById(
"rangeMode"
);

const displayRange =
document.getElementById(
"displayRange"
);

const pointList =
document.getElementById(
"pointList"
);

const timeBase =
document.getElementById(
"timeBase"
);

const customHistory =
document.getElementById(
"customHistory"
);

const fromDate =
document.getElementById(
"fromDate"
);

const toDate =
document.getElementById(
"toDate"
);

const loadHistoryButton =
document.getElementById(
"loadHistoryButton"
);

const historyStatus =
document.getElementById(
"historyStatus"
);

const graphInfo =
document.getElementById(
"graphInfo"
);

const canvas =
document.getElementById(
"trendChart"
);

const printPngButton =
document.getElementById(
"printPngButton"
);


/* ==================================================
STATE
================================================== */

let liveSamples =
[];

let historySamples =
[];

let currentMode =
"live";

let zoomFactor =
1;


const visiblePoints = {

in1: true,
in2: true,
in3: true,
in4: true,
in5: true,
diff: true

};


/* ==================================================
POINT LIST
================================================== */

pointList.innerHTML =

POINTS.map(

point => `

<div
class="point-row"
data-id="${point.id}"
>

<div class="point-number">
${point.number}
</div>

<div class="point-name">
${point.name}
</div>

<div class="point-state">
ON
</div>

<div
class="color-bar"
style="background:${point.colour}"
></div>

<div class="point-value">
—
</div>

</div>

`

).join("");


/* ==================================================
LED
================================================== */

function setLed(
state
) {

led.classList.remove(
"good",
"bad",
"waiting"
);

led.classList.add(
state
);

}


/* ==================================================
MODE
================================================== */

function updateMode() {

modeBadge.classList.remove(
"live",
"history"
);


if (
currentMode ===
"history"
) {

modeBadge.classList.add(
"history"
);

modeBadge.textContent =
"HISTORY";

rangeMode.textContent =
"Historical";

}

else {

modeBadge.classList.add(
"live"
);

modeBadge.textContent =
"LIVE";

rangeMode.textContent =
"Live";

}

}


/* ==================================================
LIVE VALUES
================================================== */

function renderState(
state
) {

if (
!state ||
!state.ok ||
!Array.isArray(
state.results
)
) {

setLed(
"bad"
);

return;

}


setLed(
"good"
);


for (
const result
of state.results
) {

const element =

document.querySelector(

`[data-id="${result.id}"] .point-value`

);


if (
element
) {

element.textContent =

Number(
result.value
).toFixed(1)

+

" °C";

}

}

}


/* ==================================================
LIVE CHART
================================================== */

const chart =

new Chart(

canvas,

{

type:
"line",

data: {

labels:
[],

datasets:

POINTS.map(

point => ({

id:
point.id,

label:
point.name,

data:
[],

borderColor:
point.colour,

backgroundColor:
point.colour,

borderWidth:
2,

pointRadius:
0,

tension:
0.05

})

)

},


options: {

responsive:
true,

maintainAspectRatio:
false,

animation:
false,

interaction: {

mode:
"index",

intersect:
false

},

plugins: {

legend: {
display: false
}

},

scales: {

x: {

grid: {
color: "#ddd"
},

ticks: {
maxTicksLimit: 8,
maxRotation: 0
}

},

y: {

grid: {
color: "#ddd"
},

title: {

display:
true,

text:
"Deg.C"

}

}

}

}

}

);


/* ==================================================
VISIBILITY
================================================== */

function updateVisibility() {

POINTS.forEach(

(
point,
index
) => {

const row =

document.querySelector(

`.point-row[data-id="${point.id}"]`

);


const state =

row.querySelector(
".point-state"
);


const visible =

visiblePoints[
point.id
];


chart.setDatasetVisibility(
index,
visible
);


row.classList.toggle(
"disabled",
!visible
);


state.textContent =

visible
?
"ON"
:
"OFF";

}

);


chart.update(
"none"
);

}


pointList.addEventListener(

"click",

event => {

const row =

event.target.closest(
".point-row"
);


if (!row) {
return;
}


const id =
row.dataset.id;


visiblePoints[id] =
!visiblePoints[id];


updateVisibility();

}

);


document
.getElementById(
"showAllButton"
)
.addEventListener(

"click",

() => {

POINTS.forEach(

point => {

visiblePoints[
point.id
] = true;

}

);

updateVisibility();

}

);


document
.getElementById(
"hideAllButton"
)
.addEventListener(

"click",

() => {

POINTS.forEach(

point => {

visiblePoints[
point.id
] = false;

}

);

updateVisibility();

}

);


/* ==================================================
DATA
================================================== */

function sourceSamples() {

return currentMode ===
"history"
?
historySamples
:
liveSamples;

}


function visibleSamples() {

const source =
sourceSamples();


if (!source.length) {

return [];

}


if (
currentMode ===
"history"
) {

return source;

}


const minutes =

Number(
timeBase.value
);


const newest =

new Date(

source[
source.length - 1
].timestamp

).getTime();


let samples =

source.filter(

sample =>

new Date(
sample.timestamp
).getTime()

>=

newest

-

minutes *
60000

);


if (
zoomFactor > 1
) {

samples =

samples.slice(

-Math.max(

2,

Math.floor(

samples.length /
zoomFactor

)

)

);

}


return samples;

}


/* ==================================================
DRAW
================================================== */

function drawTrend() {

const samples =
visibleSamples();


chart.data.labels =

samples.map(

sample =>

new Date(

sample.timestamp

).toLocaleString()

);


POINTS.forEach(

(
point,
index
) => {

chart.data.datasets[
index
].data =

samples.map(

sample =>
sample[
point.id
]

);

}

);


updateVisibility();

updateMode();


if (
samples.length
) {

displayRange.textContent =

new Date(

samples[0].timestamp

).toLocaleString()

+

" → "

+

new Date(

samples[
samples.length - 1
].timestamp

).toLocaleString();

}

else {

displayRange.textContent =
"No data";

}


graphInfo.textContent =

`${samples.length} ${

currentMode ===
"history"
?
"historical"
:
"live"

} samples`;

}


/* ==================================================
LIVE DATA
================================================== */

async function loadLiveTrend() {

if (
currentMode !==
"live"
) {

return;

}


try {

const response =

await fetch(

"/api/trend",

{
cache:
"no-store"
}

);


const data =

await response.json();


liveSamples =

Array.isArray(
data.samples
)
?
data.samples
:
[];


drawTrend();

}

catch {

graphInfo.textContent =
"Live trend unavailable";

}

}


/* ==================================================
HISTORY
================================================== */

function toInputDate(
date
) {

const offset =
date.getTimezoneOffset();


return new Date(

date.getTime()

-

offset *
60000

)
.toISOString()
.slice(
0,
16
);

}


async function loadAvailableRange() {

try {

const response =

await fetch(

"/api/history/range",

{
cache:
"no-store"
}

);


const data =

await response.json();


if (
!data.ok ||
!data.first ||
!data.last
) {

historyStatus.textContent =
"No permanent history saved yet";

return;

}


historyStatus.textContent =

`${data.count} records available`;


if (!fromDate.value) {

fromDate.value =

toInputDate(

new Date(
data.first
)

);

}


if (!toDate.value) {

toDate.value =

toInputDate(

new Date(
data.last
)

);

}

}

catch {

historyStatus.textContent =
"History database unavailable";

}

}


async function loadHistory() {

if (
!fromDate.value ||
!toDate.value
) {

alert(
"Select both From and To dates."
);

return;

}


const from =
new Date(
fromDate.value
);


const to =
new Date(
toDate.value
);


if (
from > to
) {

alert(
"From must be before To."
);

return;

}


historyStatus.textContent =
"Loading history...";


try {

const url =

"/api/history"

+

"?from="

+

encodeURIComponent(
from.toISOString()
)

+

"&to="

+

encodeURIComponent(
to.toISOString()
);


const response =

await fetch(

url,

{
cache:
"no-store"
}

);


const data =
await response.json();


if (
!response.ok ||
!data.ok
) {

throw new Error(

data.error ||
"History query failed"

);

}


historySamples =
data.samples ||
[];


currentMode =
"history";


zoomFactor =
1;


historyStatus.textContent =

`${historySamples.length} permanent records loaded`;


drawTrend();

}

catch (
error
) {

historyStatus.textContent =
"History load failed";


alert(
error.message
);

}

}


timeBase.addEventListener(

"change",

() => {

zoomFactor =
1;


if (
timeBase.value ===
"custom"
) {

customHistory.classList.add(
"show"
);

loadAvailableRange();

}

else {

customHistory.classList.remove(
"show"
);

currentMode =
"live";

loadLiveTrend();

}

}

);


loadHistoryButton.addEventListener(

"click",

loadHistory

);


/* ==================================================
BUTTONS
================================================== */

document
.getElementById(
"liveButton"
)
.addEventListener(

"click",

() => {

currentMode =
"live";

timeBase.value =
"5";

customHistory.classList.remove(
"show"
);

zoomFactor =
1;

loadLiveTrend();

}

);


document
.getElementById(
"last5Button"
)
.addEventListener(

"click",

() => {

currentMode =
"live";

timeBase.value =
"5";

customHistory.classList.remove(
"show"
);

zoomFactor =
1;

loadLiveTrend();

}

);


document
.getElementById(
"resetButton"
)
.addEventListener(

"click",

() => {

currentMode =
"live";

timeBase.value =
"5";

zoomFactor =
1;

customHistory.classList.remove(
"show"
);


POINTS.forEach(

point => {

visiblePoints[
point.id
] = true;

}

);


loadLiveTrend();

}

);


document
.getElementById(
"zoomInButton"
)
.addEventListener(

"click",

() => {

zoomFactor =

Math.min(

16,

zoomFactor * 2

);


drawTrend();

}

);


document
.getElementById(
"zoomOutButton"
)
.addEventListener(

"click",

() => {

zoomFactor =

Math.max(

1,

zoomFactor / 2

);


drawTrend();

}

);


/* ==================================================
PNG NAME
================================================== */

function makePngFileName() {

const now =
new Date();


const pad =
value =>
String(value)
.padStart(
2,
"0"
);


return (

"Greenair_A3_TrendLog_"

+

now.getFullYear()

+

"-"

+

pad(
now.getMonth() + 1
)

+

"-"

+

pad(
now.getDate()
)

+

"_"

+

pad(
now.getHours()
)

+

pad(
now.getMinutes()
)

+

".png"

);

}


/* ==================================================
FULL PAGE A3 LANDSCAPE EXPORT
================================================== */

async function createFullA3Png() {


/*
WORKING SIZE

1754 × 1240

SCALE 2

FINAL PNG

3508 × 2480
*/


const PAGE_WIDTH =
1754;

/* ==================================================
CSV
================================================== */

function buildCsv(
samples
) {

const active =

POINTS.filter(

point =>

visiblePoints[
point.id
]

);


if (!active.length) {

throw new Error(
"No points selected."
);

}


const rows = [

[
"Date",
"Time",

...active.map(

point =>
`${point.name} (C)`

)

]

];


for (
const sample
of samples
) {

const date =

new Date(
sample.timestamp
);


rows.push(

[

date.toLocaleDateString(),

date.toLocaleTimeString(),

...active.map(

point =>
sample[
point.id
]

)

]

);

}


return rows.map(

row =>

row.map(

value =>

`"${String(value)
.replace(
/"/g,
'""'
)}"`

).join(",")

).join("\r\n");

}
