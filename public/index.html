<!doctype html>
<html lang="en">

<head>

<meta charset="utf-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1"
>

<title>Bianco Precast - Greenair TrendLog</title>

<script
  src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js">
</script>

<style>

* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  min-height: 100%;
}

body {
  font-family: Arial, Helvetica, sans-serif;
  background: #f3f3f3;
  color: #222;
}


/*
==================================================
PAGE HEADER
==================================================
*/

.top-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 8px 14px;
  background: white;
  border-bottom: 1px solid #d6d6d6;
}

.brand-left {
  display: flex;
  flex-direction: column;
}

.bianco-title {
  color: #f57c00;
  font-size: 20px;
  font-weight: 900;
  letter-spacing: 1px;
}

.greenair-title {
  color: #1b5e20;
  font-size: 16px;
  font-weight: 800;
  margin-top: 1px;
}

.page-title {
  font-size: 16px;
  font-weight: 700;
  color: #333;
}

.connection-box {
  display: flex;
  align-items: center;
  gap: 8px;
}

.connection-label {
  font-size: 12px;
  color: #666;
}

.led {
  width: 14px;
  height: 14px;
  border-radius: 50%;
}

.led.good {
  background: #00c853;
  box-shadow: 0 0 7px rgba(0,200,83,0.8);
}

.led.bad {
  background: #d50000;
  box-shadow: 0 0 7px rgba(213,0,0,0.8);
}

.led.waiting {
  background: #ffb300;
  box-shadow: 0 0 7px rgba(255,179,0,0.8);
}


/*
==================================================
TOOLBAR
==================================================
*/

.toolbar {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 6px;
  padding: 8px 10px;
  background: #f7f7f7;
  border-bottom: 1px solid #d6d6d6;
}

.toolbar label {
  font-size: 12px;
  color: #444;
  font-weight: 700;
}

.toolbar select,
.toolbar button,
.toolbar input {
  height: 32px;
  border: 1px solid #c7c7c7;
  border-radius: 4px;
  background: white;
  padding: 0 10px;
  font-size: 12px;
}

.toolbar button {
  cursor: pointer;
}

.toolbar button:hover {
  background: #efefef;
}

.toolbar button.active {
  background: #1565c0;
  color: white;
  border-color: #1565c0;
}

.live-button {
  color: #2e7d32;
  border-color: #a5d6a7 !important;
}

.export-button {
  margin-left: auto;
}


/*
==================================================
CUSTOM HISTORY BAR
==================================================
*/

.custom-history {
  display: none;
  flex-wrap: wrap;
  align-items: center;
  gap: 6px;
  padding: 8px 10px;
  background: #fff8e1;
  border-bottom: 1px solid #e4d6a4;
}

.custom-history.show {
  display: flex;
}

.custom-history label {
  font-size: 12px;
  font-weight: 700;
}

.custom-history input[type="datetime-local"] {
  height: 32px;
  border: 1px solid #c7c7c7;
  border-radius: 4px;
  padding: 0 8px;
}

.custom-history button {
  height: 32px;
  border: 1px solid #c7c7c7;
  border-radius: 4px;
  padding: 0 12px;
  background: white;
  cursor: pointer;
  font-weight: 700;
}

.custom-history button:hover {
  background: #f1f1f1;
}

.history-status {
  font-size: 12px;
  color: #666;
  margin-left: 4px;
}


/*
==================================================
MAIN LAYOUT
==================================================
*/

.main-layout {
  display: grid;
  grid-template-columns: 290px 1fr;
  gap: 8px;
  padding: 8px;
  height: calc(100vh - 104px);
  min-height: 620px;
}


/*
==================================================
LEFT SIDEBAR
==================================================
*/

.sidebar {
  background: white;
  border: 1px solid #d8d8d8;
  border-radius: 4px;
  overflow: auto;
  padding: 8px;
}

.filter-row {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 6px;
  margin-bottom: 10px;
}

.filter-row select {
  width: 100%;
  height: 32px;
  border: 1px solid #ccc;
  border-radius: 4px;
  background: white;
  font-size: 12px;
}

.point-row {
  display: grid;
  grid-template-columns: 28px 1fr auto auto;
  align-items: center;
  gap: 7px;
  padding: 10px 8px;
  margin-bottom: 6px;
  border: 1px solid #e1e1e1;
  border-radius: 4px;
  background: #fafafa;
}

.point-number {
  color: #888;
  font-size: 11px;
  font-weight: 700;
}

.point-name {
  font-size: 13px;
  font-weight: 700;
}

.point-type {
  font-size: 10px;
  color: #999;
  background: #eee;
  border-radius: 10px;
  padding: 2px 6px;
}

.point-unit {
  font-size: 10px;
  font-weight: 800;
}

.point-value {
  grid-column: 2 / 5;
  font-size: 18px;
  font-weight: 900;
  color: #1b5e20;
  margin-top: 4px;
}

.color-bar {
  width: 18px;
  height: 8px;
  border-radius: 4px;
}

.color-red {
  background: red;
}

.color-blue {
  background: blue;
}

.color-green {
  background: green;
}

.color-orange {
  background: orange;
}

.color-purple {
  background: purple;
}

.color-black {
  background: black;
}


/*
==================================================
GRAPH
==================================================
*/

.graph-panel {
  background: white;
  border: 1px solid #d8d8d8;
  border-radius: 4px;
  padding: 10px;
  position: relative;
  min-width: 0;
}

.graph-container {
  position: relative;
  width: 100%;
  height: 100%;
}

.graph-info {
  position: absolute;
  right: 18px;
  bottom: 12px;
  z-index: 2;
  font-size: 11px;
  color: #666;
  background: rgba(255,255,255,0.88);
  padding: 4px 7px;
  border-radius: 3px;
}


/*
==================================================
MOBILE
==================================================
*/

@media (max-width: 850px) {

  .top-header {
    align-items: flex-start;
    gap: 8px;
  }

  .page-title {
    display: none;
  }

  .main-layout {
    grid-template-columns: 1fr;
    height: auto;
    min-height: 0;
  }

  .sidebar {
    max-height: none;
  }

  .graph-panel {
    height: 520px;
  }

  .export-button {
    margin-left: 0;
  }

}

@media (max-width: 560px) {

  .toolbar {
    gap: 4px;
  }

  .toolbar select,
  .toolbar button {
    padding: 0 7px;
    font-size: 11px;
  }

  .filter-row {
    grid-template-columns: 1fr;
  }

  .graph-panel {
    height: 430px;
  }

  .custom-history {
    align-items: stretch;
  }

  .custom-history input,
  .custom-history button {
    width: 100%;
  }

}

</style>

</head>

<body>


<!-- HEADER -->

<div class="top-header">

  <div class="brand-left">

    <div class="bianco-title">
      BIANCO PRECAST
    </div>

    <div class="greenair-title">
      GREENAIR TRENDLOG
    </div>

  </div>

  <div class="page-title">
    Trend Log
  </div>

  <div class="connection-box">

    <span class="connection-label">
      BMS
    </span>

    <div
      id="connectionLed"
      class="led waiting"
      title="Connecting"
    ></div>

  </div>

</div>


<!-- TOOLBAR -->

<div class="toolbar">

  <label for="timeBase">
    Time Base:
  </label>

  <select id="timeBase">

    <option value="5">
      5 minutes
    </option>

    <option value="15">
      15 minutes
    </option>

    <option value="30">
      30 minutes
    </option>

    <option value="60">
      1 hour
    </option>

    <option value="360">
      6 hours
    </option>

    <option value="720">
      12 hours
    </option>

    <option value="1440">
      24 hours
    </option>

    <option value="custom">
      Custom Define
    </option>

  </select>


  <button
    id="zoomInButton"
    type="button"
  >
    Zoom In
  </button>

  <button
    id="zoomOutButton"
    type="button"
  >
    Zoom Out
  </button>

  <button
    id="resetButton"
    type="button"
  >
    Reset
  </button>

  <button
    id="liveButton"
    class="live-button"
    type="button"
  >
    Live
  </button>

  <button
    id="last5Button"
    type="button"
  >
    Last 5 min
  </button>

  <button
    id="exportButton"
    class="export-button"
    type="button"
  >
    Export
  </button>

</div>


<!-- CUSTOM HISTORY -->

<div
  id="customHistory"
  class="custom-history"
>

  <button
    id="loadHistoryButton"
    type="button"
  >
    Load History File
  </button>

  <input
    id="historyFileInput"
    type="file"
    accept=".csv,text/csv"
    hidden
  >

  <label for="fromDate">
    From:
  </label>

  <input
    id="fromDate"
    type="datetime-local"
  >

  <label for="toDate">
    To:
  </label>

  <input
    id="toDate"
    type="datetime-local"
  >

  <button
    id="applyHistoryButton"
    type="button"
  >
    Apply
  </button>

  <span
    id="historyStatus"
    class="history-status"
  >
    No history file loaded
  </span>

</div>


<!-- MAIN -->

<div class="main-layout">


  <aside class="sidebar">

    <div class="filter-row">

      <select>
        <option>
          All
        </option>
      </select>

      <select>
        <option>
          By Type
        </option>
      </select>

      <select>
        <option>
          By Unit
        </option>
      </select>

    </div>

    <div id="pointList"></div>

  </aside>


  <section class="graph-panel">

    <div class="graph-container">

      <canvas
        id="trendChart"
      ></canvas>

    </div>

    <div
      id="graphInfo"
      class="graph-info"
    >
      Loading trend data...
    </div>

  </section>


</div>


<script>


/*
==================================================
POINTS
==================================================
*/

const POINTS = [

  {
    id: "in1",
    number: 1,
    name: "Planks In",
    colorClass: "color-red",
    unitColor: "red"
  },

  {
    id: "in2",
    number: 2,
    name: "Planks Out",
    colorClass: "color-blue",
    unitColor: "blue"
  },

  {
    id: "in3",
    number: 3,
    name: "Ambient",
    colorClass: "color-green",
    unitColor: "green"
  },

  {
    id: "in4",
    number: 4,
    name: "Planks Concrete",
    colorClass: "color-orange",
    unitColor: "orange"
  },

  {
    id: "in5",
    number: 5,
    name: "Planks Tank",
    colorClass: "color-purple",
    unitColor: "purple"
  },

  {
    id: "diff",
    number: 6,
    name: "Ambient - Concrete Differential",
    colorClass: "color-black",
    unitColor: "black"
  }

];


/*
==================================================
ELEMENTS
==================================================
*/

const pointList =
  document.getElementById(
    "pointList"
  );

const led =
  document.getElementById(
    "connectionLed"
  );

const canvas =
  document.getElementById(
    "trendChart"
  );

const graphInfo =
  document.getElementById(
    "graphInfo"
  );

const timeBase =
  document.getElementById(
    "timeBase"
  );

const zoomInButton =
  document.getElementById(
    "zoomInButton"
  );

const zoomOutButton =
  document.getElementById(
    "zoomOutButton"
  );

const resetButton =
  document.getElementById(
    "resetButton"
  );

const liveButton =
  document.getElementById(
    "liveButton"
  );

const last5Button =
  document.getElementById(
    "last5Button"
  );

const exportButton =
  document.getElementById(
    "exportButton"
  );

const customHistory =
  document.getElementById(
    "customHistory"
  );

const loadHistoryButton =
  document.getElementById(
    "loadHistoryButton"
  );

const historyFileInput =
  document.getElementById(
    "historyFileInput"
  );

const fromDate =
  document.getElementById(
    "fromDate"
  );

const toDate =
  document.getElementById(
    "toDate"
  );

const applyHistoryButton =
  document.getElementById(
    "applyHistoryButton"
  );

const historyStatus =
  document.getElementById(
    "historyStatus"
  );


/*
==================================================
DATA STATE
==================================================
*/

let liveSamples =
  [];

let historySamples =
  [];

let currentMode =
  "live";

let zoomFactor =
  1;


/*
==================================================
POINT LIST
==================================================
*/

pointList.innerHTML =

  POINTS.map(

    point => `

      <div
        class="point-row"
        data-id="${point.id}"
      >

        <div class="point-number">
          ${point.number}
        </div>

        <div class="point-name">
          ${point.name}
        </div>

        <div class="point-type">
          IN
        </div>

        <div
          class="point-unit"
          style="color:${point.unitColor}"
        >
          Deg.C
        </div>

        <div
          class="color-bar ${point.colorClass}"
        ></div>

        <div class="point-value">
          —
        </div>

      </div>

    `

  ).join("");


/*
==================================================
LED
==================================================
*/

function setLed(
  state
) {

  led.classList.remove(
    "good",
    "bad",
    "waiting"
  );

  led.classList.add(
    state
  );

}


/*
==================================================
LIVE VALUES
==================================================
*/

function renderState(
  state
) {

  if (
    !state ||
    !state.ok ||
    !Array.isArray(
      state.results
    )
  ) {

    setLed(
      "bad"
    );

    return;

  }


  setLed(
    "good"
  );


  for (
    const result
    of state.results
  ) {

    const valueElement =

      document.querySelector(

        `[data-id="${result.id}"] .point-value`

      );


    if (
      valueElement
    ) {

      valueElement.textContent =

        Number(
          result.value
        ).toFixed(1)

        +

        " °C";

    }

  }

}


/*
==================================================
CHART
==================================================
*/

const chart =
  new Chart(

    canvas,

    {

      type:
        "line",

      data: {

        labels:
          [],

        datasets: [

          {
            label:
              "Planks In",
            data: [],
            borderColor: "red",
            backgroundColor: "red",
            borderWidth: 2,
            pointRadius: 0,
            tension: 0.05
          },

          {
            label:
              "Planks Out",
            data: [],
            borderColor: "blue",
            backgroundColor: "blue",
            borderWidth: 2,
            pointRadius: 0,
            tension: 0.05
          },

          {
            label:
              "Ambient",
            data: [],
            borderColor: "green",
            backgroundColor: "green",
            borderWidth: 2,
            pointRadius: 0,
            tension: 0.05
          },

          {
            label:
              "Planks Concrete",
            data: [],
            borderColor: "orange",
            backgroundColor: "orange",
            borderWidth: 2,
            pointRadius: 0,
            tension: 0.05
          },

          {
            label:
              "Planks Tank",
            data: [],
            borderColor: "purple",
            backgroundColor: "purple",
            borderWidth: 2,
            pointRadius: 0,
            tension: 0.05
          },

          {
            label:
              "Ambient - Concrete Differential",
            data: [],
            borderColor: "black",
            backgroundColor: "black",
            borderWidth: 2,
            pointRadius: 0,
            tension: 0.05
          }

        ]

      },

      options: {

        responsive:
          true,

        maintainAspectRatio:
          false,

        animation:
          false,

        interaction: {
          mode: "index",
          intersect: false
        },

        plugins: {

          legend: {
            display: false
          },

          tooltip: {

            callbacks: {

              label:
                context =>

                  context.dataset.label

                  +

                  ": "

                  +

                  Number(
                    context.raw
                  ).toFixed(1)

                  +

                  " °C"

            }

          }

        },

        scales: {

          x: {

            grid: {
              color: "#d9d9d9"
            },

            ticks: {
              maxTicksLimit: 8,
              maxRotation: 0
            }

          },

          y: {

            grid: {
              color: "#d9d9d9"
            },

            ticks: {
              color: "#d32f2f"
            },

            title: {
              display: true,
              text: "Deg.C",
              color: "#d32f2f"
            }

          }

        }

      }

    }

  );


/*
==================================================
GET ACTIVE DATA
==================================================
*/

function getSourceSamples() {

  return currentMode === "history"
    ? historySamples
    : liveSamples;

}


/*
==================================================
VISIBLE SAMPLES
==================================================
*/

function getVisibleSamples() {

  const source =
    getSourceSamples();


  if (
    source.length === 0
  ) {

    return [];

  }


  if (
    currentMode === "history"
  ) {

    return source;

  }


  const selected =
    timeBase.value;


  if (
    selected === "custom"
  ) {

    return source;

  }


  const minutes =
    Number(
      selected
    );


  const newestTime =

    new Date(

      source[
        source.length - 1
      ].timestamp

    ).getTime();


  const windowMs =

    minutes *
    60 *
    1000;


  let visible =

    source.filter(

      sample =>

        new Date(
          sample.timestamp
        ).getTime()

        >=

        newestTime -
        windowMs

    );


  if (
    zoomFactor > 1 &&
    visible.length > 2
  ) {

    const wanted =

      Math.max(

        2,

        Math.floor(

          visible.length /
          zoomFactor

        )

      );


    visible =
      visible.slice(
        -wanted
      );

  }


  return visible;

}


/*
==================================================
DRAW TREND
==================================================
*/

function drawTrend() {

  const samples =
    getVisibleSamples();


  chart.data.labels =

    samples.map(

      sample =>

        new Date(

          sample.timestamp

        ).toLocaleString(

          [],

          {
            month: "2-digit",
            day: "2-digit",
            hour: "2-digit",
            minute: "2-digit",
            second: "2-digit"
          }

        )

    );


  chart.data.datasets[0].data =
    samples.map(
      sample => sample.in1
    );

  chart.data.datasets[1].data =
    samples.map(
      sample => sample.in2
    );

  chart.data.datasets[2].data =
    samples.map(
      sample => sample.in3
    );

  chart.data.datasets[3].data =
    samples.map(
      sample => sample.in4
    );

  chart.data.datasets[4].data =
    samples.map(
      sample => sample.in5
    );

  chart.data.datasets[5].data =
    samples.map(
      sample => sample.diff
    );


  chart.update(
    "none"
  );


  graphInfo.textContent =

    currentMode === "history"

    ? `${samples.length} historical samples`

    : `${samples.length} live samples shown`;

}


/*
==================================================
LOAD LIVE TREND
==================================================
*/

async function loadTrend() {

  if (
    currentMode !== "live"
  ) {

    return;

  }


  try {

    const response =
      await fetch(

        "/api/trend",

        {
          cache:
            "no-store"
        }

      );


    const trend =
      await response.json();


    if (
      !response.ok ||
      !trend.ok
    ) {

      throw new Error(
        "Trend unavailable"
      );

    }


    liveSamples =

      Array.isArray(
        trend.samples
      )

      ? trend.samples

      : [];


    drawTrend();

  }


  catch {

    graphInfo.textContent =
      "Trend unavailable";

  }

}


/*
==================================================
CSV PARSER
==================================================
*/

function parseCsvLine(
  line
) {

  const values =
    [];

  let current =
    "";

  let insideQuotes =
    false;


  for (
    let i = 0;
    i < line.length;
    i++
  ) {

    const char =
      line[i];


    if (
      char === '"'
    ) {

      if (
        insideQuotes &&
        line[i + 1] === '"'
      ) {

        current += '"';
        i++;

      }

      else {

        insideQuotes =
          !insideQuotes;

      }

    }

    else if (
      char === "," &&
      !insideQuotes
    ) {

      values.push(
        current
      );

      current =
        "";

    }

    else {

      current +=
        char;

    }

  }


  values.push(
    current
  );


  return values;

}


/*
==================================================
PARSE HISTORY CSV
==================================================
*/

function parseHistoryCsv(
  text
) {

  const lines =

    text
      .replace(/\r/g, "")
      .split("\n")
      .filter(
        line =>
          line.trim() !== ""
      );


  if (
    lines.length < 2
  ) {

    throw new Error(
      "The history file does not contain any trend data."
    );

  }


  const rows =
    [];


  for (
    let i = 1;
    i < lines.length;
    i++
  ) {

    const columns =
      parseCsvLine(
        lines[i]
      );


    if (
      columns.length < 8
    ) {

      continue;

    }


    const dateText =
      columns[0].trim();

    const timeText =
      columns[1].trim();


    const timestamp =
      new Date(
        `${dateText} ${timeText}`
      );


    if (
      Number.isNaN(
        timestamp.getTime()
      )
    ) {

      continue;

    }


    rows.push({

      timestamp:
        timestamp.toISOString(),

      in1:
        Number(columns[2]),

      in2:
        Number(columns[3]),

      in3:
        Number(columns[4]),

      in4:
        Number(columns[5]),

      in5:
        Number(columns[6]),

      diff:
        Number(columns[7])

    });

  }


  return rows.filter(

    row =>

      [
        row.in1,
        row.in2,
        row.in3,
        row.in4,
        row.in5,
        row.diff
      ].every(
        value =>
          Number.isFinite(
            value
          )
      )

  );

}


/*
==================================================
SET DATE RANGE FROM FILE
==================================================
*/

function setHistoryDateRange() {

  if (
    historySamples.length === 0
  ) {

    return;

  }


  const first =
    new Date(
      historySamples[0].timestamp
    );


  const last =
    new Date(
      historySamples[
        historySamples.length - 1
      ].timestamp
    );


  function toLocalInputValue(
    date
  ) {

    const offset =
      date.getTimezoneOffset();

    const local =

      new Date(

        date.getTime()

        -

        offset *
        60000

      );


    return local
      .toISOString()
      .slice(0,16);

  }


  fromDate.value =
    toLocalInputValue(
      first
    );


  toDate.value =
    toLocalInputValue(
      last
    );

}


/*
==================================================
LOAD HISTORY FILE
==================================================
*/

loadHistoryButton.addEventListener(

  "click",

  () => {

    historyFileInput.click();

  }

);


historyFileInput.addEventListener(

  "change",

  async event => {

    const file =
      event.target.files[0];


    if (
      !file
    ) {

      return;

    }


    try {

      const text =
        await file.text();


      const parsed =
        parseHistoryCsv(
          text
        );


      if (
        parsed.length === 0
      ) {

        throw new Error(
          "No valid trend samples were found in this CSV."
        );

      }


      historySamples =

        parsed.sort(

          (
            a,
            b
          ) =>

            new Date(
              a.timestamp
            )

            -

            new Date(
              b.timestamp
            )

        );


      setHistoryDateRange();


      historyStatus.textContent =

        `${file.name} • ${historySamples.length} samples loaded`;


      currentMode =
        "history";


      drawTrend();

    }


    catch (
      error
    ) {

      historyStatus.textContent =
        "History file could not be loaded";


      alert(
        error.message
      );

    }

  }

);


/*
==================================================
APPLY CUSTOM DATE RANGE
==================================================
*/

applyHistoryButton.addEventListener(

  "click",

  () => {

    if (
      historySamples.length === 0
    ) {

      alert(
        "Load a history CSV file first."
      );

      return;

    }


    if (
      !fromDate.value ||
      !toDate.value
    ) {

      alert(
        "Choose both From and To dates."
      );

      return;

    }


    const from =
      new Date(
        fromDate.value
      ).getTime();


    const to =
      new Date(
        toDate.value
      ).getTime();


    if (
      from > to
    ) {

      alert(
        "The From date must be before the To date."
      );

      return;

    }


    const filtered =

      historySamples.filter(

        sample => {

          const time =

            new Date(
              sample.timestamp
            ).getTime();


          return (

            time >= from &&
            time <= to

          );

        }

      );


    if (
      filtered.length === 0
    ) {

      alert(
        "There is no trend data in that selected period."
      );

      return;

    }


    currentMode =
      "history";


    const original =
      historySamples;


    historySamples =
      filtered;


    drawTrend();


    historySamples =
      original;


    graphInfo.textContent =

      `${filtered.length} historical samples shown`;

  }

);


/*
==================================================
BUILD CSV
==================================================
*/

function buildCsv(
  samples
) {

  const rows = [

    [
      "Date",
      "Time",
      "Planks In (C)",
      "Planks Out (C)",
      "Ambient (C)",
      "Planks Concrete (C)",
      "Planks Tank (C)",
      "Ambient Concrete Differential (C)"
    ]

  ];


  for (
    const sample
    of samples
  ) {

    const timestamp =
      new Date(
        sample.timestamp
      );


    rows.push([

      timestamp.toLocaleDateString(),

      timestamp.toLocaleTimeString(),

      sample.in1,

      sample.in2,

      sample.in3,

      sample.in4,

      sample.in5,

      sample.diff

    ]);

  }


  return rows.map(

    row =>

      row.map(

        value =>

          `"${String(value)
            .replace(
              /"/g,
              '""'
            )}"`

      ).join(",")

  ).join("\r\n");

}


/*
==================================================
DOWNLOAD
==================================================
*/

function downloadBlob(
  blob,
  fileName
) {

  const url =
    URL.createObjectURL(
      blob
    );


  const link =
    document.createElement(
      "a"
    );


  link.href =
    url;

  link.download =
    fileName;


  document.body.appendChild(
    link
  );


  link.click();


  link.remove();


  setTimeout(

    () =>
      URL.revokeObjectURL(
        url
      ),

    1000

  );

}


/*
==================================================
TOOLBAR EVENTS
==================================================
*/

timeBase.addEventListener(

  "change",

  () => {

    if (
      timeBase.value ===
      "custom"
    ) {

      customHistory.classList.add(
        "show"
      );

    }

    else {

      customHistory.classList.remove(
        "show"
      );


      currentMode =
        "live";


      zoomFactor =
        1;


      drawTrend();

    }

  }

);


zoomInButton.addEventListener(

  "click",

  () => {

    zoomFactor =
      Math.min(
        zoomFactor * 2,
        16
      );

    drawTrend();

  }

);


zoomOutButton.addEventListener(

  "click",

  () => {

    zoomFactor =
      Math.max(
        1,
        zoomFactor / 2
      );

    drawTrend();

  }

);


resetButton.addEventListener(

  "click",

  () => {

    currentMode =
      "live";


    zoomFactor =
      1;


    timeBase.value =
      "5";


    customHistory.classList.remove(
      "show"
    );


    drawTrend();

  }

);


liveButton.addEventListener(

  "click",

  () => {

    currentMode =
      "live";


    zoomFactor =
      1;


    if (
      timeBase.value ===
      "custom"
    ) {

      timeBase.value =
        "5";

    }


    customHistory.classList.remove(
      "show"
    );


    loadTrend();

  }

);


last5Button.addEventListener(

  "click",

  () => {

    currentMode =
      "live";


    timeBase.value =
      "5";


    zoomFactor =
      1;


    customHistory.classList.remove(
      "show"
    );


    loadTrend();

  }

);


exportButton.addEventListener(

  "click",

  () => {

    const samples =
      getVisibleSamples();


    if (
      samples.length === 0
    ) {

      alert(
        "No trend data available"
      );

      return;

    }


    const csv =
      buildCsv(
        samples
      );


    const blob =
      new Blob(

        [csv],

        {
          type:
            "text/csv;charset=utf-8"
        }

      );


    downloadBlob(

      blob,

      currentMode === "history"

      ? "Greenair_History_Export.csv"

      : "Greenair_TrendLog.csv"

    );

  }

);


/*
==================================================
INITIAL STATE
==================================================
*/

setLed(
  "waiting"
);


fetch(

  "/api/state",

  {
    cache:
      "no-store"
  }

)

.then(

  response =>
    response.json()

)

.then(

  state =>
    renderState(
      state
    )

)

.catch(

  () =>
    setLed(
      "bad"
    )

);


/*
==================================================
LIVE STREAM
==================================================
*/

const stream =
  new EventSource(
    "/api/stream"
  );


stream.addEventListener(

  "state",

  event => {

    try {

      renderState(

        JSON.parse(
          event.data
        )

      );

    }

    catch {

      setLed(
        "bad"
      );

    }

  }

);


stream.onerror =

  () => {

    setLed(
      "bad"
    );

  };


/*
==================================================
START
==================================================
*/

loadTrend();


setInterval(

  loadTrend,

  15000

);

</script>
