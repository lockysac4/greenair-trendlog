<!doctype html>
<html lang="en">

<head>

<meta charset="utf-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1"
>

<title>Bianco Precast - Greenair TrendLog</title>

<script
  src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js">
</script>

<style>

* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  min-height: 100%;
}

body {
  font-family: Arial, Helvetica, sans-serif;
  background: #f3f3f3;
  color: #222;
}


/*
==================================================
PAGE HEADER
==================================================
*/

.top-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 8px 14px;
  background: white;
  border-bottom: 1px solid #d6d6d6;
}

.brand-left {
  display: flex;
  flex-direction: column;
}

.bianco-title {
  color: #f57c00;
  font-size: 20px;
  font-weight: 900;
  letter-spacing: 1px;
}

.greenair-title {
  color: #1b5e20;
  font-size: 16px;
  font-weight: 800;
  margin-top: 1px;
}

.page-title {
  font-size: 16px;
  font-weight: 700;
  color: #333;
}

.connection-box {
  display: flex;
  align-items: center;
  gap: 8px;
}

.connection-label {
  font-size: 12px;
  color: #666;
}

.led {
  width: 14px;
  height: 14px;
  border-radius: 50%;
}

.led.good {
  background: #00c853;
  box-shadow: 0 0 7px rgba(0,200,83,0.8);
}

.led.bad {
  background: #d50000;
  box-shadow: 0 0 7px rgba(213,0,0,0.8);
}

.led.waiting {
  background: #ffb300;
  box-shadow: 0 0 7px rgba(255,179,0,0.8);
}


/*
==================================================
TOOLBAR
==================================================
*/

.toolbar {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 6px;
  padding: 8px 10px;
  background: #f7f7f7;
  border-bottom: 1px solid #d6d6d6;
}

.toolbar label {
  font-size: 12px;
  color: #444;
  font-weight: 700;
}

.toolbar select,
.toolbar button {
  height: 32px;
  border: 1px solid #c7c7c7;
  border-radius: 4px;
  background: white;
  padding: 0 10px;
  font-size: 12px;
  cursor: pointer;
}

.toolbar button:hover {
  background: #efefef;
}

.toolbar button.active {
  background: #1565c0;
  color: white;
  border-color: #1565c0;
}

.live-button {
  color: #2e7d32;
  border-color: #a5d6a7 !important;
}

.export-button {
  margin-left: auto;
}


/*
==================================================
MAIN LAYOUT
==================================================
*/

.main-layout {
  display: grid;
  grid-template-columns: 290px 1fr;
  gap: 8px;
  padding: 8px;
  height: calc(100vh - 104px);
  min-height: 620px;
}


/*
==================================================
LEFT SIDEBAR
==================================================
*/

.sidebar {
  background: white;
  border: 1px solid #d8d8d8;
  border-radius: 4px;
  overflow: auto;
  padding: 8px;
}

.filter-row {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 6px;
  margin-bottom: 10px;
}

.filter-row select {
  width: 100%;
  height: 32px;
  border: 1px solid #ccc;
  border-radius: 4px;
  background: white;
  font-size: 12px;
}

.point-row {
  display: grid;
  grid-template-columns: 28px 1fr auto auto;
  align-items: center;
  gap: 7px;
  padding: 10px 8px;
  margin-bottom: 6px;
  border: 1px solid #e1e1e1;
  border-radius: 4px;
  background: #fafafa;
}

.point-number {
  color: #888;
  font-size: 11px;
  font-weight: 700;
}

.point-name {
  font-size: 13px;
  font-weight: 700;
}

.point-type {
  font-size: 10px;
  color: #999;
  background: #eee;
  border-radius: 10px;
  padding: 2px 6px;
}

.point-unit {
  font-size: 10px;
  font-weight: 800;
}

.point-value {
  grid-column: 2 / 5;
  font-size: 18px;
  font-weight: 900;
  color: #1b5e20;
  margin-top: 4px;
}

.color-bar {
  width: 18px;
  height: 8px;
  border-radius: 4px;
}

.color-red {
  background: red;
}

.color-blue {
  background: blue;
}

.color-green {
  background: green;
}

.color-orange {
  background: orange;
}

.color-purple {
  background: purple;
}

.color-black {
  background: black;
}


/*
==================================================
GRAPH AREA
==================================================
*/

.graph-panel {
  background: white;
  border: 1px solid #d8d8d8;
  border-radius: 4px;
  padding: 10px;
  position: relative;
  min-width: 0;
}

.graph-container {
  position: relative;
  width: 100%;
  height: 100%;
}

.graph-info {
  position: absolute;
  right: 18px;
  bottom: 12px;
  z-index: 2;
  font-size: 11px;
  color: #666;
  background: rgba(255,255,255,0.88);
  padding: 4px 7px;
  border-radius: 3px;
}


/*
==================================================
MOBILE
==================================================
*/

@media (max-width: 850px) {

  .top-header {
    align-items: flex-start;
    gap: 8px;
  }

  .page-title {
    display: none;
  }

  .main-layout {
    grid-template-columns: 1fr;
    height: auto;
    min-height: 0;
  }

  .sidebar {
    max-height: none;
  }

  .graph-panel {
    height: 520px;
  }

  .export-button {
    margin-left: 0;
  }

}

@media (max-width: 560px) {

  .toolbar {
    gap: 4px;
  }

  .toolbar select,
  .toolbar button {
    padding: 0 7px;
    font-size: 11px;
  }

  .filter-row {
    grid-template-columns: 1fr;
  }

  .graph-panel {
    height: 430px;
  }

}

</style>

</head>

<body>


<!--
==================================================
TOP HEADER
==================================================
-->

<div class="top-header">

  <div class="brand-left">

    <div class="bianco-title">
      BIANCO PRECAST
    </div>

    <div class="greenair-title">
      GREENAIR TRENDLOG
    </div>

  </div>


  <div class="page-title">
    Trend Log
  </div>


  <div class="connection-box">

    <span class="connection-label">
      BMS
    </span>

    <div
      id="connectionLed"
      class="led waiting"
      title="Connecting"
    ></div>

  </div>

</div>


<!--
==================================================
TOP TOOLBAR
==================================================
-->

<div class="toolbar">

  <label for="timeBase">
    Time Base:
  </label>

  <select id="timeBase">

    <option value="5">
      5 minutes
    </option>

    <option value="15">
      15 minutes
    </option>

    <option value="30">
      30 minutes
    </option>

    <option value="60">
      1 hour
    </option>

    <option value="360">
      6 hours
    </option>

    <option value="720">
      12 hours
    </option>

    <option value="1440">
      24 hours
    </option>

  </select>


  <button
    id="zoomInButton"
    type="button"
  >
    Zoom In
  </button>


  <button
    id="zoomOutButton"
    type="button"
  >
    Zoom Out
  </button>


  <button
    id="resetButton"
    type="button"
  >
    Reset
  </button>


  <button
    id="liveButton"
    class="live-button"
    type="button"
  >
    Live
  </button>


  <button
    id="last5Button"
    type="button"
  >
    Last 5 min
  </button>


  <button
    id="exportButton"
    class="export-button"
    type="button"
  >
    Export
  </button>

</div>


<!--
==================================================
MAIN SCREEN
==================================================
-->

<div class="main-layout">


  <!-- LEFT SIDE -->

  <aside class="sidebar">

    <div class="filter-row">

      <select>
        <option>
          All
        </option>
      </select>

      <select>
        <option>
          By Type
        </option>
      </select>

      <select>
        <option>
          By Unit
        </option>
      </select>

    </div>


    <div
      id="pointList"
    ></div>

  </aside>


  <!-- GRAPH -->

  <section class="graph-panel">

    <div class="graph-container">

      <canvas
        id="trendChart"
      ></canvas>

    </div>

    <div
      id="graphInfo"
      class="graph-info"
    >
      Loading trend data...
    </div>

  </section>


</div>


<script>


/*
==================================================
POINT DEFINITIONS
==================================================
*/

const POINTS = [

  {
    id: "in1",
    number: 1,
    name: "Planks In",
    colorClass: "color-red",
    unitColor: "red"
  },

  {
    id: "in2",
    number: 2,
    name: "Planks Out",
    colorClass: "color-blue",
    unitColor: "blue"
  },

  {
    id: "in3",
    number: 3,
    name: "Ambient",
    colorClass: "color-green",
    unitColor: "green"
  },

  {
    id: "in4",
    number: 4,
    name: "Planks Concrete",
    colorClass: "color-orange",
    unitColor: "orange"
  },

  {
    id: "in5",
    number: 5,
    name: "Planks Tank",
    colorClass: "color-purple",
    unitColor: "purple"
  },

  {
    id: "diff",
    number: 6,
    name: "Ambient - Concrete Differential",
    colorClass: "color-black",
    unitColor: "black"
  }

];


/*
==================================================
PAGE ELEMENTS
==================================================
*/

const pointList =
  document.getElementById(
    "pointList"
  );

const led =
  document.getElementById(
    "connectionLed"
  );

const canvas =
  document.getElementById(
    "trendChart"
  );

const graphInfo =
  document.getElementById(
    "graphInfo"
  );

const timeBase =
  document.getElementById(
    "timeBase"
  );

const zoomInButton =
  document.getElementById(
    "zoomInButton"
  );

const zoomOutButton =
  document.getElementById(
    "zoomOutButton"
  );

const resetButton =
  document.getElementById(
    "resetButton"
  );

const liveButton =
  document.getElementById(
    "liveButton"
  );

const last5Button =
  document.getElementById(
    "last5Button"
  );

const exportButton =
  document.getElementById(
    "exportButton"
  );


/*
==================================================
POINT LIST
==================================================
*/

pointList.innerHTML =

  POINTS.map(

    point => `

      <div
        class="point-row"
        data-id="${point.id}"
      >

        <div class="point-number">
          ${point.number}
        </div>

        <div class="point-name">
          ${point.name}
        </div>

        <div class="point-type">
          IN
        </div>

        <div
          class="point-unit"
          style="color:${point.unitColor}"
        >
          Deg.C
        </div>

        <div
          class="color-bar ${point.colorClass}"
        ></div>

        <div class="point-value">
          —
        </div>

      </div>

    `

  ).join("");


/*
==================================================
LED
==================================================
*/

function setLed(
  state
) {

  led.classList.remove(
    "good",
    "bad",
    "waiting"
  );


  led.classList.add(
    state
  );


  if (
    state === "good"
  ) {

    led.title =
      "Connection Good";

  }

  else if (
    state === "bad"
  ) {

    led.title =
      "Connection Bad";

  }

  else {

    led.title =
      "Connecting";

  }

}


/*
==================================================
LIVE VALUES
==================================================
*/

function renderState(
  state
) {

  if (
    !state ||
    !state.ok ||
    !Array.isArray(
      state.results
    )
  ) {

    setLed(
      "bad"
    );

    return;

  }


  setLed(
    "good"
  );


  for (
    const result
    of state.results
  ) {

    const valueElement =

      document.querySelector(

        `[data-id="${result.id}"] .point-value`

      );


    if (
      valueElement
    ) {

      valueElement.textContent =

        Number(
          result.value
        ).toFixed(1)

        +

        " °C";

    }

  }

}


/*
==================================================
CHART
==================================================
*/

const chart =
  new Chart(

    canvas,

    {

      type:
        "line",

      data: {

        labels:
          [],

        datasets: [

          {
            label:
              "Planks In",

            data:
              [],

            borderColor:
              "red",

            backgroundColor:
              "red",

            borderWidth:
              2,

            pointRadius:
              0,

            tension:
              0.05
          },

          {
            label:
              "Planks Out",

            data:
              [],

            borderColor:
              "blue",

            backgroundColor:
              "blue",

            borderWidth:
              2,

            pointRadius:
              0,

            tension:
              0.05
          },

          {
            label:
              "Ambient",

            data:
              [],

            borderColor:
              "green",

            backgroundColor:
              "green",

            borderWidth:
              2,

            pointRadius:
              0,

            tension:
              0.05
          },

          {
            label:
              "Planks Concrete",

            data:
              [],

            borderColor:
              "orange",

            backgroundColor:
              "orange",

            borderWidth:
              2,

            pointRadius:
              0,

            tension:
              0.05
          },

          {
            label:
              "Planks Tank",

            data:
              [],

            borderColor:
              "purple",

            backgroundColor:
              "purple",

            borderWidth:
              2,

            pointRadius:
              0,

            tension:
              0.05
          },

          {
            label:
              "Ambient - Concrete Differential",

            data:
              [],

            borderColor:
              "black",

            backgroundColor:
              "black",

            borderWidth:
              2,

            pointRadius:
              0,

            tension:
              0.05
          }

        ]

      },


      options: {

        responsive:
          true,

        maintainAspectRatio:
          false,

        animation:
          false,

        interaction: {

          mode:
            "index",

          intersect:
            false

        },

        plugins: {

          legend: {
            display: false
          },

          tooltip: {

            callbacks: {

              label:
                context => {

                  return (

                    context.dataset.label

                    +

                    ": "

                    +

                    Number(
                      context.raw
                    ).toFixed(1)

                    +

                    " °C"

                  );

                }

            }

          }

        },

        scales: {

          x: {

            grid: {
              color:
                "#d9d9d9"
            },

            ticks: {

              maxTicksLimit:
                8,

              maxRotation:
                0

            }

          },

          y: {

            grid: {
              color:
                "#d9d9d9"
            },

            ticks: {

              color:
                "#d32f2f"

            },

            title: {

              display:
                true,

              text:
                "Deg.C",

              color:
                "#d32f2f"

            }

          }

        }

      }

    }

  );


/*
==================================================
TREND FILTER
==================================================
*/

let allSamples =
  [];

let zoomFactor =
  1;


function getVisibleSamples() {

  const minutes =
    Number(
      timeBase.value
    );


  if (
    allSamples.length === 0
  ) {

    return [];

  }


  const newestTime =

    new Date(

      allSamples[
        allSamples.length - 1
      ].timestamp

    ).getTime();


  const windowMs =

    minutes *
    60 *
    1000;


  let visible =

    allSamples.filter(

      sample =>

        new Date(
          sample.timestamp
        ).getTime()

        >=

        newestTime -
        windowMs

    );


  if (
    zoomFactor >
    1 &&
    visible.length >
    2
  ) {

    const wanted =

      Math.max(

        2,

        Math.floor(

          visible.length /
          zoomFactor

        )

      );


    visible =
      visible.slice(
        -wanted
      );

  }


  return visible;

}


/*
==================================================
DRAW TREND
==================================================
*/

function drawTrend() {

  const samples =
    getVisibleSamples();


  chart.data.labels =

    samples.map(

      sample =>

        new Date(

          sample.timestamp

        ).toLocaleTimeString(

          [],

          {

            hour:
              "2-digit",

            minute:
              "2-digit",

            second:
              "2-digit"

          }

        )

    );


  chart.data.datasets[0].data =
    samples.map(
      sample => sample.in1
    );


  chart.data.datasets[1].data =
    samples.map(
      sample => sample.in2
    );


  chart.data.datasets[2].data =
    samples.map(
      sample => sample.in3
    );


  chart.data.datasets[3].data =
    samples.map(
      sample => sample.in4
    );


  chart.data.datasets[4].data =
    samples.map(
      sample => sample.in5
    );


  chart.data.datasets[5].data =
    samples.map(
      sample => sample.diff
    );


  chart.update(
    "none"
  );


  graphInfo.textContent =

    samples.length

    +

    " samples shown";

}


/*
==================================================
LOAD TREND DATA
==================================================
*/

async function loadTrend() {

  try {

    const response =
      await fetch(

        "/api/trend",

        {
          cache:
            "no-store"
        }

      );


    const trend =
      await response.json();


    if (
      !response.ok ||
      !trend.ok
    ) {

      throw new Error(
        "Trend unavailable"
      );

    }


    allSamples =

      Array.isArray(
        trend.samples
      )

      ? trend.samples

      : [];


    drawTrend();

  }


  catch (
    error
  ) {

    graphInfo.textContent =
      "Trend unavailable";

  }

}


/*
==================================================
CSV EXPORT
==================================================
*/

function buildCsv(
  samples
) {

  const rows = [

    [
      "Date",
      "Time",
      "Planks In (C)",
      "Planks Out (C)",
      "Ambient (C)",
      "Planks Concrete (C)",
      "Planks Tank (C)",
      "Ambient Concrete Differential (C)"
    ]

  ];


  for (
    const sample
    of samples
  ) {

    const timestamp =
      new Date(
        sample.timestamp
      );


    rows.push([

      timestamp
        .toLocaleDateString(),

      timestamp
        .toLocaleTimeString(),

      sample.in1,

      sample.in2,

      sample.in3,

      sample.in4,

      sample.in5,

      sample.diff

    ]);

  }


  return rows.map(

    row =>

      row.map(

        value =>

          `"${String(value)
            .replace(
              /"/g,
              '""'
            )}"`

      ).join(",")

  ).join("\r\n");

}


/*
==================================================
DOWNLOAD
==================================================
*/

function downloadBlob(
  blob,
  fileName
) {

  const url =
    URL.createObjectURL(
      blob
    );


  const link =
    document.createElement(
      "a"
    );


  link.href =
    url;


  link.download =
    fileName;


  document.body.appendChild(
    link
  );


  link.click();


  link.remove();


  setTimeout(

    () => {

      URL.revokeObjectURL(
        url
      );

    },

    1000

  );

}


/*
==================================================
TOOLBAR EVENTS
==================================================
*/

timeBase.addEventListener(

  "change",

  () => {

    zoomFactor =
      1;

    drawTrend();

  }

);


zoomInButton.addEventListener(

  "click",

  () => {

    zoomFactor =
      Math.min(
        zoomFactor * 2,
        16
      );

    drawTrend();

  }

);


zoomOutButton.addEventListener(

  "click",

  () => {

    zoomFactor =
      Math.max(
        1,
        zoomFactor / 2
      );

    drawTrend();

  }

);


resetButton.addEventListener(

  "click",

  () => {

    zoomFactor =
      1;

    timeBase.value =
      "5";

    drawTrend();

  }

);


liveButton.addEventListener(

  "click",

  () => {

    zoomFactor =
      1;

    drawTrend();

  }

);


last5Button.addEventListener(

  "click",

  () => {

    timeBase.value =
      "5";

    zoomFactor =
      1;

    drawTrend();

  }

);


exportButton.addEventListener(

  "click",

  () => {

    const samples =
      getVisibleSamples();


    if (
      samples.length === 0
    ) {

      alert(
        "No trend data available"
      );

      return;

    }


    const csv =
      buildCsv(
        samples
      );


    const blob =
      new Blob(

        [csv],

        {
          type:
            "text/csv;charset=utf-8"
        }

      );


    downloadBlob(

      blob,

      "Greenair_TrendLog.csv"

    );

  }

);


/*
==================================================
INITIAL LIVE STATE
==================================================
*/

setLed(
  "waiting"
);


fetch(

  "/api/state",

  {
    cache:
      "no-store"
  }

)

.then(

  response =>
    response.json()

)

.then(

  state =>
    renderState(
      state
    )

)

.catch(

  () =>
    setLed(
      "bad"
    )

);


/*
==================================================
LIVE STREAM
==================================================
*/

const stream =
  new EventSource(
    "/api/stream"
  );


stream.addEventListener(

  "state",

  event => {

    try {

      renderState(

        JSON.parse(
          event.data
        )

      );

    }

    catch {

      setLed(
        "bad"
      );

    }

  }

);


stream.onerror =

  () => {

    setLed(
      "bad"
    );

  };


/*
==================================================
START TREND
==================================================
*/

loadTrend();


setInterval(

  loadTrend,

  15000

);

</script>

</body>

</html>
