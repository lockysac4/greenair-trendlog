<!doctype html>
<html lang="en">

<head>

<meta charset="utf-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1"
>

<title>Bianco Precast - Greenair TrendLog</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>

<style>

* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  min-height: 100%;
}

body {
  font-family: Arial, Helvetica, sans-serif;
  background: #f3f3f3;
  color: #222;
}


/* ==================================================
HEADER
================================================== */

.top-header {
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  align-items: center;

  padding: 8px 14px;

  background: white;

  border-bottom: 1px solid #d6d6d6;
}


.brand-left {
  justify-self: start;
}


.bianco-title {
  color: #f57c00;

  font-size: 20px;
  font-weight: 900;
  letter-spacing: 1px;
}


.greenair-title {
  color: #1b5e20;

  font-size: 16px;
  font-weight: 800;
}


.header-centre {
  display: flex;
  flex-direction: column;
  align-items: center;

  gap: 3px;
}


.page-title {
  font-size: 17px;
  font-weight: 800;
}


.mode-badge {
  padding: 3px 12px;

  border-radius: 14px;

  font-size: 11px;
  font-weight: 900;
}


.mode-badge.live {
  background: #dff6df;
  color: #166c20;
}


.mode-badge.history {
  background: #e3f2fd;
  color: #0d47a1;
}


.connection-box {
  justify-self: end;

  display: flex;
  align-items: center;

  gap: 7px;
}


.connection-label {
  font-size: 12px;
  font-weight: 800;
}


.led {
  width: 15px;
  height: 15px;

  border-radius: 50%;
}


.led.good {
  background: #00b63d;

  box-shadow:
    0 0 7px rgba(0,182,61,.75);
}


.led.bad {
  background: #d50000;

  box-shadow:
    0 0 7px rgba(213,0,0,.75);
}


.led.waiting {
  background: #ffb300;

  box-shadow:
    0 0 7px rgba(255,179,0,.75);
}


/* ==================================================
DATE
================================================== */

.date-row {
  padding: 4px 12px;

  background: white;

  border-bottom: 1px solid #ddd;

  font-size: 12px;
  font-weight: 600;
}


/* ==================================================
TOOLBAR
================================================== */

.toolbar {
  display: flex;
  flex-wrap: wrap;
  align-items: center;

  gap: 7px;

  padding: 7px 10px;

  background: #f7f7f7;

  border-bottom: 1px solid #d6d6d6;
}


.toolbar label {
  font-size: 12px;
  font-weight: 800;
}


.toolbar select,
.toolbar button {
  height: 32px;

  border: 1px solid #c7c7c7;
  border-radius: 4px;

  background: white;

  padding: 0 11px;

  font-size: 12px;
}


.toolbar button {
  cursor: pointer;
}


.toolbar button:hover {
  background: #eeeeee;
}


.live-button {
  background: #e1f5e3 !important;

  color: #146b20;

  border-color: #a6dca9 !important;
}


.print-button {
  background: #7b1fa2 !important;

  color: white;

  border-color: #7b1fa2 !important;

  font-weight: 800;
}


.export-button {
  background: #263238 !important;

  color: white;

  border-color: #263238 !important;
}


.user-button {
  background: #1565c0 !important;
  color: white !important;
  border-color: #1565c0 !important;
  font-weight: 800;
  display: none;
}


.logout-button {
  background: #b71c1c !important;
  color: white !important;
  border-color: #b71c1c !important;
  font-weight: 800;
}


.logged-user {
  margin-left: auto;
  padding: 0 6px;
  font-size: 11px;
  font-weight: 800;
  color: #444;
}


@media print {

  .user-button,
  .logout-button,
  .logged-user {
    display: none !important;
  }

}


/* ==================================================
CUSTOM HISTORY
================================================== */

.custom-history {
  display: none;
  flex-wrap: wrap;
  align-items: center;

  gap: 8px;

  padding: 8px 10px;

  background: #fff8e1;

  border-bottom: 1px solid #e4d6a4;
}


.custom-history.show {
  display: flex;
}


.custom-history label {
  font-size: 12px;
  font-weight: 800;
}


.custom-history input {
  height: 32px;

  border: 1px solid #c7c7c7;
  border-radius: 4px;

  padding: 0 8px;
}


.custom-history button {
  height: 32px;

  border: 0;
  border-radius: 4px;

  padding: 0 14px;

  background: #1565c0;
  color: white;

  font-weight: 800;

  cursor: pointer;
}


.history-status {
  font-size: 12px;
  color: #666;
}


/* ==================================================
RANGE
================================================== */

.range-bar {
  display: flex;
  justify-content: space-between;

  gap: 10px;

  padding: 4px 12px;

  background: white;

  border-bottom: 1px solid #ddd;

  font-size: 11px;

  color: #666;
}


.range-bar strong {
  color: #222;
}


/* ==================================================
MAIN LAYOUT
================================================== */

.main-layout {
  display: grid;

  grid-template-columns:
    280px 1fr;

  gap: 7px;

  padding: 7px;

  height: calc(100vh - 151px);

  min-height: 620px;
}


/* ==================================================
SIDEBAR
================================================== */

.sidebar {
  background: white;

  border: 1px solid #d4d4d4;

  padding: 8px;

  overflow: auto;
}


.filter-row {
  display: grid;

  grid-template-columns:
    1fr 1fr 1fr;

  gap: 5px;

  margin-bottom: 8px;
}


.filter-row button {
  height: 32px;

  background: white;

  border: 1px solid #ccc;
  border-radius: 3px;

  cursor: pointer;
}


.point-row {
  display: grid;

  grid-template-columns:
    26px 1fr auto;

  align-items: center;

  gap: 7px;

  padding: 10px 7px;

  margin-bottom: 5px;

  border: 1px solid #dddddd;
  border-radius: 3px;

  background: #fafafa;

  cursor: pointer;
}


.point-row.disabled {
  opacity: .35;
}


.point-number {
  font-size: 11px;

  color: #777;
}


.point-middle {
  display: flex;
  align-items: center;

  gap: 7px;
}


.point-colour {
  width: 18px;
  height: 8px;

  border-radius: 8px;

  flex-shrink: 0;
}


.point-name {
  font-size: 12px;
  font-weight: 800;
}


.point-unit {
  font-size: 10px;
  font-weight: 800;
}


.point-value {
  grid-column: 2 / 4;

  margin-top: 3px;

  font-size: 16px;
  font-weight: 900;

  color: #1b5e20;
}


/* ==================================================
GRAPH
================================================== */

.graph-panel {
  position: relative;

  min-width: 0;

  background: white;

  border: 1px solid #cfcfcf;

  padding: 7px;
}


.graph-container {
  position: relative;

  width: 100%;
  height: 100%;
}


.graph-info {
  position: absolute;

  right: 16px;
  bottom: 10px;

  padding: 3px 6px;

  background: rgba(255,255,255,.88);

  color: #777;

  font-size: 10px;
}


/* ==================================================
MOBILE
================================================== */

@media (max-width: 850px) {

  .main-layout {
    grid-template-columns: 1fr;

    height: auto;
  }


  .graph-panel {
    height: 520px;
  }

}

PRINT - ONE A3 LANDSCAPE PAGE
================================================== */

  size: A3 landscape;
  margin: 3mm;
