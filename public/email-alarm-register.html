<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Greenair TrendLog - Email Alarm Register</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#f2f4f3;color:#222}
.topbar{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 18px;background:white;border-bottom:1px solid #d6d6d6}
.brand{display:flex;align-items:center;gap:12px}.brand-logo{display:block;width:160px;max-height:52px;object-fit:contain}
.brand-text{display:flex;flex-direction:column}.bianco{color:#f57c00;font-size:20px;font-weight:900}.greenair{color:#1b5e20;font-size:14px;font-weight:800}
.top-actions{display:flex;gap:8px;flex-wrap:wrap}.top-actions a,.top-actions button{display:inline-flex;align-items:center;justify-content:center;min-height:34px;padding:0 12px;border:1px solid #ccc;border-radius:5px;background:white;color:#222;text-decoration:none;font-size:12px;font-weight:800;cursor:pointer}
.top-actions .back{background:#082847;color:white;border-color:#082847}.top-actions .logout{background:#b71c1c;color:white;border-color:#b71c1c}
.wrap{max-width:1100px;margin:24px auto;padding:0 16px}.panel{background:white;border:1px solid #ddd;border-radius:8px;padding:18px;margin-bottom:18px}
h1{margin:0 0 6px;font-size:22px}.sub{color:#666;font-size:13px}.placeholder{margin-top:16px;padding:18px;border:1px dashed #c9c9c9;border-radius:6px;background:#fafafa;color:#555}
@media(max-width:760px){.topbar{align-items:flex-start;flex-direction:column}.brand-logo{width:140px}}
</style>
</head>
<body>
<div class="topbar">
  <div class="brand">
    <img class="brand-logo" src="/greenair-logo.png" alt="Greenair">
    <div class="brand-text"><div class="bianco">BIANCO PRECAST</div><div class="greenair">GREENAIR TRENDLOG</div></div>
  </div>
  <div class="top-actions">
    <a class="back" href="/admin">User Management</a>
    <a href="/">TrendLog</a>
    <button id="logoutButton" class="logout" type="button">Logout</button>
  </div>
</div>
<div class="wrap">
  <div class="panel">
    <h1>Email Alarm Register</h1>
    <div id="currentUser" class="sub">Checking Master account...</div>
    <div class="placeholder">Email alarm register configuration page created. We can add the register numbers, alarm conditions, recipients, delays and email messages here next.</div>
  </div>
</div>
<script>
async function fetchJson(url,options={}){const response=await fetch(url,options);const data=await response.json();if(!response.ok){if(response.status===401)location.href='/login';throw new Error(data.error||'Request failed')}return data}
(async()=>{try{const data=await fetchJson('/api/auth/me');if(data.user.role!=='master'){document.body.innerHTML="<h2 style='font-family:Arial;padding:30px'>Master access required</h2>";return}document.getElementById('currentUser').textContent=`Logged in as ${data.user.username} — Master Administrator`}catch{location.href='/login'}})();
document.getElementById('logoutButton').addEventListener('click',async()=>{try{await fetch('/api/auth/logout',{method:'POST'})}catch{}location.href='/login'});
</script>
</body>
</html>
