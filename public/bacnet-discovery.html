<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Greenair BACnet Discovery</title>
<style>
body{font-family:Arial,Helvetica,sans-serif;background:#f3f3f3;margin:0;color:#222}
.wrap{max-width:900px;margin:30px auto;padding:0 16px}
.card{background:#fff;border:1px solid #d5d5d5;border-radius:8px;padding:20px}
h1{margin-top:0;color:#1b5e20}
button{padding:12px 18px;font-weight:800;border:0;border-radius:5px;cursor:pointer;background:#1565c0;color:#fff}
pre{white-space:pre-wrap;word-break:break-word;background:#111;color:#eee;padding:16px;border-radius:6px;min-height:220px}
.note{background:#e8f5e9;border:1px solid #b7dfbd;padding:12px;border-radius:5px;margin:14px 0}
</style>
</head>
<body>
<div class="wrap"><div class="card">
<h1>Greenair BACnet/IP Discovery</h1>
<div class="note">
This test is discovery-only. It does not command any boiler or pump outputs.
It sends a BACnet Who-Is to the Bianco controller on UDP port 47808 and waits
five seconds for an I-Am response.
</div>
<button onclick="discover()">DISCOVER BACnet DEVICE</button>
<pre id="out">Ready.</pre>
</div></div>
<script>
async function discover(){
 const out=document.getElementById("out");
 out.textContent="Sending BACnet Who-Is and waiting 5 seconds...";
 try{
   const r=await fetch("/api/bacnet/discover",{cache:"no-store"});
   const raw=await r.text();
   let d=null; try{d=JSON.parse(raw)}catch{}
   out.textContent=
     "HTTP status: "+r.status+"\n\n"+
     (d?.ok && d.responses?.length
       ? "BACnet Device Instance: "+d.responses.find(x=>Number.isInteger(x.deviceInstance))?.deviceInstance+"\n\n"
       : "No BACnet I-Am received.\n\n")+
     "Full response:\n"+raw;
 }catch(e){
   out.textContent="ERROR\n"+e.stack;
 }
}
</script>
</body>
</html>
