<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Greenair TrendLog - User Management</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#f2f4f3;color:#222}
.topbar{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 18px;background:white;border-bottom:1px solid #d6d6d6}
.brand{display:flex;align-items:center;gap:12px}
.brand-logo{display:block;width:160px;max-height:52px;object-fit:contain}
.brand-text{display:flex;flex-direction:column}
.bianco{color:#f57c00;font-size:20px;font-weight:900}
.greenair{color:#1b5e20;font-size:14px;font-weight:800}
.top-actions{display:flex;gap:8px}
.top-actions button,.top-actions a{display:inline-flex;align-items:center;justify-content:center;min-height:34px;padding:0 12px;border:1px solid #ccc;border-radius:5px;background:white;color:#222;text-decoration:none;font-size:12px;font-weight:800;cursor:pointer}
.top-actions .dropbox{background:#0061ff;color:white;border-color:#0061ff}
.top-actions .alarm-register{background:#ef6c00;color:white;border-color:#ef6c00}
.top-actions .logout{background:#b71c1c;color:white;border-color:#b71c1c}
.wrap{max-width:1100px;margin:24px auto;padding:0 16px}
.panel{background:white;border:1px solid #ddd;border-radius:8px;padding:18px;margin-bottom:18px}
h1,h2{margin-top:0}
h1{font-size:22px}
h2{font-size:17px}
.form-grid{display:grid;grid-template-columns:1fr 1fr auto;gap:10px;align-items:end}
.field label{display:block;margin-bottom:5px;font-size:12px;font-weight:800}
.field input{width:100%;height:38px;padding:0 10px;border:1px solid #bbb;border-radius:5px;font-size:14px}
.primary{height:38px;padding:0 16px;border:0;border-radius:5px;background:#1b5e20;color:white;font-weight:800;cursor:pointer}
.message{min-height:20px;margin-top:10px;font-size:13px;font-weight:700}
.message.good{color:#1b5e20}.message.bad{color:#b00020}
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;background:white}
th,td{padding:10px;border-bottom:1px solid #e5e5e5;text-align:left;font-size:12px;vertical-align:middle}
th{background:#f7f7f7;font-weight:900}
.role{font-weight:800}.status-active{color:#1b5e20;font-weight:800}.status-disabled{color:#b00020;font-weight:800}
.action-row{display:flex;flex-wrap:wrap;gap:5px}
.small-button{min-height:30px;padding:0 9px;border:1px solid #bbb;border-radius:4px;background:white;font-size:11px;font-weight:700;cursor:pointer}
.small-button.danger{background:#b71c1c;color:white;border-color:#b71c1c}
.small-button.warn{background:#ef6c00;color:white;border-color:#ef6c00}
.small-button.enable{background:#2e7d32;color:white;border-color:#2e7d32}
.master-note{color:#666;font-size:11px}
@media(max-width:760px){
  .form-grid{grid-template-columns:1fr}
  .topbar{align-items:flex-start;flex-direction:column}
  .brand-logo{width:140px}
}
</style>
</head>
<body>
<div class="topbar">
  <div class="brand">
    <img class="brand-logo" src="/greenair-logo.png" alt="Greenair">
    <div class="brand-text">
      <div class="bianco">BIANCO PRECAST</div>
      <div class="greenair">GREENAIR TRENDLOG</div>
    </div>
  </div>
  <div class="top-actions">
    <a class="dropbox" href="/dropbox/connect">Connect Dropbox</a>
    <a class="alarm-register" href="/email-alarm-register.html">Email Alarm Register</a>
    <a href="/">TrendLog</a>
    <button id="logoutButton" class="logout" type="button">Logout</button>
  </div>
</div>

<div class="wrap">
  <div class="panel">
    <h1>User Management</h1>
    <div id="currentUser" class="master-note">Checking Master account...</div>
  </div>

  <div class="panel">
    <h2>Create New User</h2>
    <form id="createUserForm" class="form-grid">
      <div class="field">
        <label for="newUsername">Username</label>
        <input id="newUsername" type="text" autocomplete="off" required>
      </div>
      <div class="field">
        <label for="newPassword">Password</label>
        <input id="newPassword" type="password" autocomplete="new-password" required>
      </div>
      <button class="primary" type="submit">Create User</button>
    </form>
    <div id="createMessage" class="message"></div>
  </div>

  <div class="panel">
    <h2>Existing Users</h2>
    <div class="table-wrap">
      <table>
        <thead>
          <tr><th>Username</th><th>Role</th><th>Status</th><th>Created</th><th>Last Login</th><th>Actions</th></tr>
        </thead>
        <tbody id="usersBody"><tr><td colspan="6">Loading...</td></tr></tbody>
      </table>
    </div>
  </div>
</div>

<script>
const currentUser=document.getElementById("currentUser");
const createUserForm=document.getElementById("createUserForm");
const newUsername=document.getElementById("newUsername");
const newPassword=document.getElementById("newPassword");
const createMessage=document.getElementById("createMessage");
const usersBody=document.getElementById("usersBody");
const logoutButton=document.getElementById("logoutButton");

function formatDate(value){return value?new Date(value).toLocaleString("en-AU"):"—"}
function escapeHtml(value){
  return String(value??"")
    .replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;")
    .replaceAll('"',"&quot;").replaceAll("'","&#039;");
}
async function fetchJson(url,options={}){
  const response=await fetch(url,options);
  const data=await response.json();
  if(!response.ok){
    if(response.status===401) window.location.href="/login";
    throw new Error(data.error||"Request failed");
  }
  return data;
}
async function checkMaster(){
  const data=await fetchJson("/api/auth/me");
  if(data.user.role!=="master"){
    document.body.innerHTML="<h2 style='font-family:Arial;padding:30px'>Master access required</h2>";
    return false;
  }
  currentUser.textContent=`Logged in as ${data.user.username} — Master Administrator`;
  return true;
}
async function loadUsers(){
  try{
    const data=await fetchJson("/api/users");
    usersBody.innerHTML=data.users.map(user=>{
      const statusClass=user.active?"status-active":"status-disabled";
      const statusText=user.active?"Active":"Disabled";
      let actions="";
      if(user.role==="master"){
        actions='<span class="master-note">Protected Master account</span>';
      }else{
        actions=`
        <div class="action-row">
          <button class="small-button" type="button" onclick="resetPassword(${user.id}, '${escapeHtml(user.username)}')">Reset Password</button>
          <button class="small-button ${user.active?"warn":"enable"}" type="button" onclick="toggleUser(${user.id}, ${!user.active})">${user.active?"Disable":"Enable"}</button>
          <button class="small-button danger" type="button" onclick="deleteUser(${user.id}, '${escapeHtml(user.username)}')">Delete</button>
        </div>`;
      }
      return `<tr>
        <td>${escapeHtml(user.username)}</td>
        <td class="role">${escapeHtml(user.role)}</td>
        <td class="${statusClass}">${statusText}</td>
        <td>${formatDate(user.createdAt)}</td>
        <td>${formatDate(user.lastLoginAt)}</td>
        <td>${actions}</td>
      </tr>`;
    }).join("");
  }catch(error){
    usersBody.innerHTML=`<tr><td colspan="6">${escapeHtml(error.message)}</td></tr>`;
  }
}
createUserForm.addEventListener("submit",async event=>{
  event.preventDefault();
  createMessage.className="message";
  createMessage.textContent="Creating user...";
  try{
    await fetchJson("/api/users",{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({username:newUsername.value,password:newPassword.value})
    });
    createMessage.className="message good";
    createMessage.textContent="User created successfully.";
    newUsername.value=""; newPassword.value="";
    await loadUsers();
  }catch(error){
    createMessage.className="message bad";
    createMessage.textContent=error.message;
  }
});
async function resetPassword(userId,username){
  const password=prompt(`Enter a new password for ${username}:`);
  if(password===null)return;
  try{
    await fetchJson("/api/users/password",{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({userId,password})
    });
    alert(`Password reset for ${username}.`);
    await loadUsers();
  }catch(error){alert(error.message)}
}
async function toggleUser(userId,active){
  try{
    await fetchJson("/api/users/active",{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({userId,active})
    });
    await loadUsers();
  }catch(error){alert(error.message)}
}
async function deleteUser(userId,username){
  if(!confirm(`Delete user "${username}"?\n\nThis cannot be undone.`))return;
  try{
    await fetchJson("/api/users/delete",{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({userId})
    });
    await loadUsers();
  }catch(error){alert(error.message)}
}
logoutButton.addEventListener("click",async()=>{
  try{await fetch("/api/auth/logout",{method:"POST"})}catch{}
  window.location.href="/login";
});
(async()=>{
  try{
    const allowed=await checkMaster();
    if(allowed)await loadUsers();
  }catch{window.location.href="/login"}
})();
</script>
</body>
</html>
